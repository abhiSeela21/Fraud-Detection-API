name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: fraud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FRAUD_DATABASE_URL: postgresql+psycopg://fraud:ci_test_only@localhost:5432/fraud_test
      TEST_DATABASE_URL: postgresql+psycopg://fraud:ci_test_only@localhost:5432/fraud_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - run: uv sync --frozen --group training
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run --group training pytest
      - run: uv run --group training python training/train.py
      - run: uv run --group training python training/tune_recall.py --select-only
      - run: uv run --group training python training/tune_recall.py
      - run: jq -e '.promotion_passed' ../docs/evaluation/recall-policy/results.json
      - run: docker build -t fraud-api .
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: fraud_frontend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud_frontend_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FRAUD_DATABASE_URL: postgresql+psycopg://fraud:ci_test_only@localhost:5432/fraud_frontend_test
      FRAUD_COOKIE_SECURE: "false"
      FRAUD_FRONTEND_ORIGIN: http://localhost:5173
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run python scripts/export_openapi.py --check
        working-directory: backend
      - run: npm ci --no-audit --no-fund
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t fraud-demo .
      - run: docker build -t fraud-hosted ..
      - name: Start packaged same-origin demo
        run: >-
          docker run -d --network host --name fraud-hosted
          -e FRAUD_ENVIRONMENT=test -e FRAUD_COOKIE_SECURE=false
          -e FRAUD_FRONTEND_ORIGIN=http://localhost:5180
          -e FRAUD_DATABASE_URL
          --entrypoint uvicorn fraud-hosted fraud_api.deployment:create_app
          --factory --host 0.0.0.0 --port 5180
          --no-proxy-headers --no-access-log --log-config logging.json
      - name: Wait for packaged readiness
        run: timeout 60 bash -c 'until curl -fsS http://localhost:5180/api/health; do sleep 1; done'
      - name: Test packaged same-origin demo
        run: npm run test:e2e
        env:
          DEMO_BASE_URL: http://localhost:5180
      - name: Stop packaged demo
        if: always()
        run: docker rm -f fraud-hosted || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          retention-days: 7
