[project]
name = "fraud-detection-api"
version = "0.1.0"
description = "Synthetic transaction risk scoring API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]
training = ["scikit-learn>=1.7,<2", "numpy>=2,<3"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"training/train.py" = ["E501"] # Markdown report paragraphs and table rows.
"training/benchmark.py" = ["E501"] # Markdown report paragraphs and table rows.
"training/data.py" = ["E501"] # Dataset record construction.
"training/report.py" = ["E501"] # Markdown report paragraphs and table rows.
"training/tune_recall.py" = ["E501"] # Markdown report paragraphs and table rows.

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
